name: MATLAB verification

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: matlab-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regenerate-and-validate:
    name: Regenerate and validate reference data
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v3
        with:
          release: R2024a
          products: Symbolic_Math_Toolbox
          cache: true

      - name: Run clean verification pipeline
        uses: matlab-actions/run-command@v3
        with:
          command: addpath(fullfile(pwd, 'verification')); run_verification(fullfile(pwd, 'artifacts', 'matlab'))

      - name: Record artifact checksums
        if: always()
        shell: bash
        run: |
          if [[ -d artifacts/matlab ]]; then
            cd artifacts/matlab
            find . -type f ! -name SHA256SUMS -print0 \
              | sort -z \
              | xargs -0 sha256sum > SHA256SUMS
          fi

      - name: Ensure the runner did not modify tracked files
        run: git diff --exit-code

      - name: Upload regenerated data and manifest
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: matlab-verification-${{ github.sha }}
          path: artifacts/matlab
          if-no-files-found: warn
          retention-days: 30
